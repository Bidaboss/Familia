<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ouvrir dans Familia</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!--
    The page of a shared link (PRD, récit 31): /o/<kind>/<id>. It shows no family data, only the
    kind of item. With Familia installed, Android usually opens the app before this page; here the
    button opens it (familia://). The page never shows the installation link: the family sends it
    to whoever joins (a product decision for l'admin if it should change).
  -->
  <main>
    <div class="brand">Familia</div>
    <h1 id="title">Un message de la famille</h1>
    <p id="body">Il s'ouvre dans l'appli Familia, réservée à la famille.</p>
    <a id="open" class="button filled" href="#">Ouvrir dans Familia</a>
    <p style="margin-top: 24px">Pas encore l'appli ? Demande le lien d'installation à la personne qui t'a envoyé ce message.</p>
  </main>
  <script>
    (function () {
      var titles = {
        event: 'Un événement de la famille',
        poll: 'Un sondage de la famille',
        birthday: 'Un anniversaire de la famille',
        list: 'Une liste d’envies',
        goodNews: 'Une bonne nouvelle',
        trip: 'Un voyage de la famille',
        help: 'Un coup de main'
      };
      var parts = location.pathname.split('/').filter(Boolean);
      var kind = parts[1], id = parts[2];
      var valid = parts.length === 3 && parts[0] === 'o' && titles.hasOwnProperty(kind) && /^[A-Za-z0-9_-]{1,64}$/.test(id || '');
      var open = document.getElementById('open');
      if (!valid) {
        open.hidden = true;
        document.getElementById('body').textContent = 'Ce lien n’est pas complet. Demande à la personne qui te l’a envoyé de le partager à nouveau.';
        return;
      }
      document.getElementById('title').textContent = titles[kind];
      open.href = 'intent://o/' + kind + '/' + id + '#Intent;scheme=familia;S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end';
    })();
  </script>
</body>
</html>
