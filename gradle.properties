org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Reuse task outputs already built (on this computer, or on GitHub through the cache of main).
org.gradle.caching=true

# A download that fails (network, « 429 Too Many Requests ») is tried again up to 6 times, waiting
# longer each time (2 s, then 4 s, 8 s…), instead of 3 times within a second.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
