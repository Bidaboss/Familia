name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Test APKs are signed with the stable test key kept in GitHub secrets. Without it, they are
    # signed with a throwaway debug key that changes on every run. The release key is never used here.
    env:
      FAMILIA_TEST_KEYSTORE_BASE64: ${{ secrets.FAMILIA_TEST_KEYSTORE_BASE64 }}
      FAMILIA_TEST_KEYSTORE_PASSWORD: ${{ secrets.FAMILIA_TEST_KEYSTORE_PASSWORD }}
      FAMILIA_TEST_KEY_ALIAS: ${{ secrets.FAMILIA_TEST_KEY_ALIAS }}
      FAMILIA_TEST_KEY_PASSWORD: ${{ secrets.FAMILIA_TEST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore test signing key
        if: ${{ env.FAMILIA_TEST_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$FAMILIA_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/familia-test.jks"
          echo "FAMILIA_TEST_KEYSTORE_PATH=$RUNNER_TEMP/familia-test.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Unit tests and screenshots
        run: ./gradlew --no-daemon recordRoborazziDebug

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecrans
          path: app/build/outputs/roborazzi/
          retention-days: 14

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - run: npm ci

      - name: Run the rules tests against the Firestore emulator
        run: npm run test:emulator
