name: CI

on:
  pull_request:
  push:
    branches: [main]

# On a pull request, a new commit stops the build of the previous one. On main, runs are never
# cancelled: only a finished main build saves the Gradle cache that pull requests then reuse.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which parts a pull request touches. A skipped job counts as passed for GitHub. On main,
  # everything runs. Unsure (the list cannot be read), everything runs too.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      firebase: ${{ steps.filter.outputs.firebase }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || ! files=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "firebase=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          android=false
          firebase=false
          while IFS= read -r f; do
            case "$f" in
              .github/*) android=true; firebase=true ;;
              firebase/*) firebase=true ;;
              docs/*|*.md) ;;
              *) android=true ;;
            esac
          done <<< "$files"
          echo "Android : $android, Firebase : $firebase"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "firebase=$firebase" >> "$GITHUB_OUTPUT"

  # Each Gradle call goes through scripts/gradle-reessai.sh: a failure due only to the network
  # (« 429 » of Maven Central, a cut download) is run once more after a minute, a real one is not.
  # The Android checks run as three jobs side by side instead of one after the other (23/11): the
  # pull request waits for the longest one (about 8 min) instead of their sum (about 20 min).
  # Each job restores the same Gradle cache from main, so none of them starts from scratch.
  tests:
    name: Unit tests and screenshots
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and screenshots
        run: scripts/gradle-reessai.sh recordRoborazziDebug

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecrans
          path: app/build/outputs/roborazzi/
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  lint:
    name: Android lint
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android lint
        run: scripts/gradle-reessai.sh lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-lint
          path: app/build/reports/
          retention-days: 14

  apk:
    name: Build debug and release APKs
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Test APKs are signed with the stable test key kept in GitHub secrets. Without it, they are
    # signed with a throwaway debug key that changes on every run. The release key is never used here.
    env:
      FAMILIA_TEST_KEYSTORE_BASE64: ${{ secrets.FAMILIA_TEST_KEYSTORE_BASE64 }}
      FAMILIA_TEST_KEYSTORE_PASSWORD: ${{ secrets.FAMILIA_TEST_KEYSTORE_PASSWORD }}
      FAMILIA_TEST_KEY_ALIAS: ${{ secrets.FAMILIA_TEST_KEY_ALIAS }}
      FAMILIA_TEST_KEY_PASSWORD: ${{ secrets.FAMILIA_TEST_KEY_PASSWORD }}
      # No FAMILIA_DOWNLOAD_URL here (audit 2.4): the test APKs are public artifacts, so they carry
      # no install link. Only « APK de publication » builds it in.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore test signing key
        if: ${{ env.FAMILIA_TEST_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$FAMILIA_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/familia-test.jks"
          echo "FAMILIA_TEST_KEYSTORE_PATH=$RUNNER_TEMP/familia-test.jks" >> "$GITHUB_ENV"

      # Both APKs in one Gradle call (one start-up, one configuration). The release build is shrunk by R8 (audit du 22/11) and left unsigned here: it shows on every
      # PR that R8 still builds, and gives the size the family will download. lintVitalRelease is
      # skipped here only: the « Android lint » job runs the full lint (a superset of it) on the same
      # code, and « APK de publication » still runs it before the family gets an APK.
      - name: Build debug APK and release APK with R8 (unsigned)
        run: |
          scripts/gradle-reessai.sh assembleDebug assembleRelease -x lintVitalRelease
          {
            echo "### Taille des APK"
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              echo "- $(basename "$apk") : $(du -h "$apk" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  rules:
    name: Firestore security rules tests
    needs: changes
    if: ${{ needs.changes.outputs.firebase == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json

      - run: npm ci

      - name: Run the rules tests against the Firestore emulator
        run: npm run test:emulator

      - name: Install the Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Build the Cloud Functions and run their tests against the emulator
        run: npm run test:functions
