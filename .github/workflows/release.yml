name: APK de publication

# Run by hand from the Actions tab ("Run workflow"), from main (docs/mise-a-jour.md). It numbers
# the version by itself, builds and signs the APK, replaces the APK of the family's Drive folder,
# then announces the version in config/app: everyone sees « Nouvelle version disponible ».
# Only this workflow sees the release key; pull requests never do.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build the signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each secret is given only to the steps of ours that need it, never to the external actions
    # (checkout, setup-java, setup-gradle, upload-artifact).
    steps:
      - name: Only from main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Lance ce workflow depuis la branche main."
          exit 1

      - uses: actions/checkout@v4
        with:
          # The whole history of main, to count its commits.
          fetch-depth: 0

      # One more commit on main, one more version: never twice the same number, nothing to edit.
      - name: Number the version
        run: |
          code=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Version numéro $code"

      - name: Check that everything needed is there
        env:
          FAMILIA_KEYSTORE_BASE64: ${{ secrets.FAMILIA_KEYSTORE_BASE64 }}
          FAMILIA_KEYSTORE_PASSWORD: ${{ secrets.FAMILIA_KEYSTORE_PASSWORD }}
          FAMILIA_KEY_ALIAS: ${{ secrets.FAMILIA_KEY_ALIAS }}
          FAMILIA_KEY_PASSWORD: ${{ secrets.FAMILIA_KEY_PASSWORD }}
          FIREBASE_SECRET_ACCOUNT: ${{ secrets.FIREBASE_SECRET_ACCOUNT }}
          FAMILIA_DOWNLOAD_URL: ${{ secrets.FAMILIA_DOWNLOAD_URL }}
        run: |
          missing=0
          for name in FAMILIA_KEYSTORE_BASE64 FAMILIA_KEYSTORE_PASSWORD FAMILIA_KEY_ALIAS FAMILIA_KEY_PASSWORD FIREBASE_SECRET_ACCOUNT FAMILIA_DOWNLOAD_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Le secret GitHub $name manque (Settings, Secrets and variables, Actions)."
              missing=1
            fi
          done
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json manque : sans lui, l'appli n'a pas de données (docs/firebase-setup.md)."
            missing=1
          fi
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release key
        env:
          FAMILIA_KEYSTORE_BASE64: ${{ secrets.FAMILIA_KEYSTORE_BASE64 }}
        run: |
          echo "$FAMILIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/familia-release.jks"
          echo "FAMILIA_KEYSTORE_PATH=$RUNNER_TEMP/familia-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          FAMILIA_KEYSTORE_PASSWORD: ${{ secrets.FAMILIA_KEYSTORE_PASSWORD }}
          FAMILIA_KEY_ALIAS: ${{ secrets.FAMILIA_KEY_ALIAS }}
          FAMILIA_KEY_PASSWORD: ${{ secrets.FAMILIA_KEY_PASSWORD }}
          FAMILIA_DOWNLOAD_URL: ${{ secrets.FAMILIA_DOWNLOAD_URL }}
        run: ./gradlew --no-daemon assembleRelease -PfamiliaVersionCode="$VERSION_CODE"

      - name: Check the signature and name the file
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::L'APK signé n'a pas été produit (le fichier est-il resté non signé ?)."
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk" | tee signature.txt
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          version=$("$aapt" dump badging "$apk" | grep -oP "versionName='\K[^']+")
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APK_PATH=$PWD/out/familia-$version.apk" >> "$GITHUB_ENV"
          mkdir -p out
          cp "$apk" "out/familia-$version.apk"
          {
            echo "### Familia $version"
            echo "Empreinte de la clé :"
            echo '```'
            grep "SHA-256" signature.txt
            echo '```'
            echo "L'APK est déposé dans le dossier Drive et annoncé à la famille (étape « Publish to the family »)."
            echo "Il reste aussi téléchargeable dans l'artefact **familia-apk** ci-dessous."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/familia-release.jks"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-apk
          path: out/*.apk
          retention-days: 30

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - run: npm ci
        working-directory: firebase/functions

      # The Drive folder comes from the secret FAMILIA_DOWNLOAD_URL, the link built into the app
      # and the invitation.
      - name: Publish to the family
        working-directory: firebase/functions
        env:
          FIREBASE_SECRET_ACCOUNT: ${{ secrets.FIREBASE_SECRET_ACCOUNT }}
          FAMILIA_DOWNLOAD_URL: ${{ secrets.FAMILIA_DOWNLOAD_URL }}
        run: |
          key="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SECRET_ACCOUNT" > "$key"
          FOLDER_ID=$(printf '%s' "$FAMILIA_DOWNLOAD_URL" | grep -oP 'drive/folders/\K[A-Za-z0-9_-]+' || true)
          PROJECT_ID=$(node -p "JSON.parse(require('fs').readFileSync('../.firebaserc', 'utf8')).projects.default")
          FOLDER_ID="$FOLDER_ID" PROJECT_ID="$PROJECT_ID" GOOGLE_APPLICATION_CREDENTIALS="$key" \
            node scripts/publish-release.mjs
