name: Publier Firebase

# Run by hand from the Actions tab ("Run workflow"), from main only. Publishes the Firestore
# security rules and indexes and the Cloud Functions (notifications, reminder of the day before)
# to the project of firebase/.firebaserc. Pull requests never see the key (DEV-7, docs/deploiement.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish rules and Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Only from main
        if: ${{ github.ref != 'refs/heads/main' }}
        working-directory: .
        run: |
          echo "::error::Lance ce workflow depuis la branche main."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json

      - run: npm ci

      - run: npm ci --prefix functions

      # The secret only reaches this step, through a file deleted when the step ends.
      - name: Publish
        env:
          FIREBASE_SECRET_ACCOUNT: ${{ secrets.FIREBASE_SECRET_ACCOUNT }}
          FAMILIA_DOWNLOAD_URL: ${{ secrets.FAMILIA_DOWNLOAD_URL }}
        run: |
          if [ -z "$FIREBASE_SECRET_ACCOUNT" ]; then
            echo "::error::Le secret FIREBASE_SECRET_ACCOUNT est absent (voir docs/deploiement.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SECRET_ACCOUNT" > "$key"
          # The page of a shared link (récit 31) offers the installation with the Drive link, which
          # stays out of the public repository: written here, in the runner's copy only.
          if printf '%s' "$FAMILIA_DOWNLOAD_URL" | grep -qE '^https://drive\.google\.com/[A-Za-z0-9/?=_.-]+$'; then
            sed -i "s|__DOWNLOAD_URL__|$FAMILIA_DOWNLOAD_URL|" hosting/open.html
          else
            echo "::warning::Le secret FAMILIA_DOWNLOAD_URL manque : la page des liens partagés dira de demander le lien d'installation."
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy \
            --only firestore:rules,firestore:indexes,storage,functions,hosting \
            --non-interactive
