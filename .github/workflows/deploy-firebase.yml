name: Publier Firebase

# Run by hand from the Actions tab ("Run workflow"), from main only. Publishes the Firestore
# security rules and indexes and the Cloud Functions (notifications, reminder of the day before)
# to the project of firebase/.firebaserc. Pull requests never see the key (DEV-7, docs/deploiement.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish rules and Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Only from main
        if: ${{ github.ref != 'refs/heads/main' }}
        working-directory: .
        run: |
          echo "::error::Lance ce workflow depuis la branche main."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json

      - run: npm ci

      - run: npm ci --prefix functions

      # The secret only reaches this step, through a file deleted when the step ends.
      - name: Publish
        env:
          FIREBASE_SECRET_ACCOUNT: ${{ secrets.FIREBASE_SECRET_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SECRET_ACCOUNT" ]; then
            echo "::error::Le secret FIREBASE_SECRET_ACCOUNT est absent (voir docs/deploiement.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SECRET_ACCOUNT" > "$key"
          # --force: functions with a retry policy (onOfferedSurpriseUpdated, #632) are refused
          # without it in non-interactive mode. Up to 3 tries, 60 s apart: Google answers 409, 429
          # or 503 now and then when two publications follow each other closely.
          for try in 1 2 3; do
            if GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy \
              --only firestore:rules,firestore:indexes,storage,functions,hosting \
              --non-interactive --force; then
              exit 0
            fi
            echo "::warning::Publication refusée (essai $try sur 3)."
            [ "$try" -lt 3 ] && sleep 60
          done
          exit 1
