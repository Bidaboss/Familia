name: Créer le premier admin

# Run by hand, from main, after "Publier Firebase". On an empty family, creates the first household
# and its admin principal so that someone can sign in. On a family with members, names the adult
# with this address admin principal again (lost access); the first name and household are ignored.
on:
  workflow_dispatch:
    inputs:
      prenom:
        description: "Ton prénom, tel qu'il s'affichera (seulement pour une famille vide)"
        required: false
      adresse:
        description: "Ton adresse Google (celle du téléphone)"
        required: true
      foyer:
        description: "Nom de ton foyer, par exemple « Maison Martin » (seulement pour une famille vide)"
        required: false

permissions:
  contents: read

concurrency:
  group: first-admin
  cancel-in-progress: false

jobs:
  create:
    name: Create the first admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Only from main
        if: ${{ github.ref != 'refs/heads/main' }}
        working-directory: .
        run: |
          echo "::error::Lance ce workflow depuis la branche main."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - run: npm ci

      # GitHub shows the inputs at the top of the step, before any mask can apply: they stay
      # visible on the run page, which anyone can open on a public repository. The script itself
      # never prints them. Delete the run once it has succeeded (docs/firebase-setup.md).
      - name: Create
        env:
          FIREBASE_SECRET_ACCOUNT: ${{ secrets.FIREBASE_SECRET_ACCOUNT }}
          FIRST_NAME: ${{ inputs.prenom }}
          EMAIL: ${{ inputs.adresse }}
          HOUSEHOLD: ${{ inputs.foyer }}
        run: |
          if [ -z "$FIREBASE_SECRET_ACCOUNT" ]; then
            echo "::error::Le secret FIREBASE_SECRET_ACCOUNT est absent (voir docs/deploiement.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SECRET_ACCOUNT" > "$key"
          PROJECT_ID=$(node -p "JSON.parse(require('fs').readFileSync('../.firebaserc', 'utf8')).projects.default")
          PROJECT_ID="$PROJECT_ID" GOOGLE_APPLICATION_CREDENTIALS="$key" node scripts/first-admin.mjs
